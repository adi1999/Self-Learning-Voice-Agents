<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darwin-Gödel Voice Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117; color: #c9d1d9; display: flex;
            justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { text-align: center; max-width: 500px; padding: 2rem; }
        h1 { color: #58a6ff; margin-bottom: 0.5rem; }
        p { color: #8b949e; margin-bottom: 2rem; }
        #call-btn {
            background: #238636; color: #fff; border: none; border-radius: 8px;
            padding: 1rem 2rem; font-size: 1.2rem; cursor: pointer; transition: all 0.2s;
        }
        #call-btn:hover { background: #2ea043; }
        #call-btn.active { background: #da3633; }
        #call-btn:disabled { background: #21262d; cursor: not-allowed; }
        #status {
            margin-top: 1.5rem; padding: 0.75rem; border-radius: 4px;
            background: #161b22; border: 1px solid #30363d; font-size: 0.9rem;
        }
        .pulse {
            display: inline-block; width: 12px; height: 12px; border-radius: 50%;
            background: #3fb950; margin-right: 8px; animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Darwin-Gödel Voice Agent</h1>
    <p>Self-evolved debt collection agent — speak to test the champion prompt</p>

    <button id="call-btn" onclick="toggleCall()">Start Call</button>
    <div id="status">Ready to connect</div>
</div>

<script>
    let pc = null;
    let localStream = null;
    let isActive = false;

    async function toggleCall() {
        if (isActive) {
            stopCall();
        } else {
            await startCall();
        }
    }

    async function startCall() {
        const btn = document.getElementById('call-btn');
        const status = document.getElementById('status');
        btn.disabled = true;
        status.textContent = 'Connecting...';

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            pc = new RTCPeerConnection();

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            const audioEl = document.createElement('audio');
            audioEl.id = 'remote-audio';
            audioEl.autoplay = true;
            document.body.appendChild(audioEl);

            pc.ontrack = (event) => {
                audioEl.srcObject = event.streams[0];
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            // Wait for ICE gathering
            await new Promise(resolve => {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                } else {
                    pc.onicegatheringstatechange = () => {
                        if (pc.iceGatheringState === 'complete') resolve();
                    };
                }
            });

            const response = await fetch('/api/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type,
                }),
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.error || 'Server error');
            }

            const answer = await response.json();
            await pc.setRemoteDescription(new RTCSessionDescription({
                sdp: answer.sdp,
                type: answer.type,
            }));

            isActive = true;
            btn.textContent = 'End Call';
            btn.classList.add('active');
            btn.disabled = false;
            status.innerHTML = '<span class="pulse"></span> Connected — speak now';
        } catch (err) {
            status.textContent = `Error: ${err.message}`;
            btn.disabled = false;
            stopCall();
        }
    }

    function stopCall() {
        if (pc) { pc.close(); pc = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        const audioEl = document.getElementById('remote-audio');
        if (audioEl) audioEl.remove();

        isActive = false;
        const btn = document.getElementById('call-btn');
        btn.textContent = 'Start Call';
        btn.classList.remove('active');
        btn.disabled = false;
        document.getElementById('status').textContent = 'Call ended';
    }
</script>
</body>
</html>
